[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Every test in this suite is async; declaring the mode here keeps the
# individual tests free of decorators.
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

addopts =
    -q
    --strict-markers
    --tb=short

filterwarnings =
    ignore::DeprecationWarning:passlib.*
    ignore::DeprecationWarning:crypt.*

markers =
    network: requires outbound network access (deselect with -m "not network")
