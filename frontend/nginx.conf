# nginx serves the built SPA and proxies the API.
#
# `backend` is the Compose service name; Docker's embedded DNS resolves it.

upstream certmonitor_api {
    server backend:8000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The API already returns JSON error bodies; do not let nginx replace
    # them with its own HTML error pages.
    proxy_intercept_errors off;

    client_max_body_size 12m;   # must exceed MAX_UPLOAD_BYTES for imports

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # ------------------------------------------------ security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    # The SPA is self-contained: no external scripts, styles, fonts or
    # images, and it only talks to its own origin.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    # ------------------------------------------------------ own health
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # ---------------------------------------------------------- API
    location /api/ {
        proxy_pass http://certmonitor_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # The audit log records the client address from this header.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;

        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        # Manual checks and large imports can legitimately take a while.
        proxy_read_timeout 120s;
        proxy_buffering off;
    }

    # Probes are proxied so an external monitor can reach them through the
    # single published port.
    location ~ ^/(health|ready|live)$ {
        access_log off;
        proxy_pass http://certmonitor_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }

    # ------------------------------------------------------- assets
    # Vite emits content-hashed filenames, so these can be cached hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ------------------------------------------------- SPA fallback
    location / {
        # index.html must never be cached, or a deploy leaves clients on the
        # old asset manifest.
        add_header Cache-Control "no-store, must-revalidate";
        try_files $uri $uri/ /index.html;
    }
}
